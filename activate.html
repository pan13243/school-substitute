<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>激活学校 - 代课调课系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 480px; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 40px; margin-bottom: 8px; }
    .logo-text { font-size: 20px; font-weight: 700; color: #1e40af; }
    .logo-sub { font-size: 13px; color: #6b7280; margin-top: 4px; }
    h1 { font-size: 22px; font-weight: 700; color: #111827; text-align: center; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #6b7280; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    input.error { border-color: #ef4444; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .btn { width: 100%; padding: 12px; background: #1e40af; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    .btn:hover { background: #1e3a8a; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 18px; display: none; }
    .alert.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .result { text-align: center; display: none; }
    .result-icon { font-size: 56px; margin-bottom: 12px; }
    .result h2 { font-size: 20px; color: #111827; margin-bottom: 10px; }
    .result-url { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 14px; margin: 14px 0; }
    .result-url a { color: #1d4ed8; font-size: 15px; font-weight: 600; word-break: break-all; }
    .result-url a:hover { text-decoration: underline; }
    .result-info { font-size: 13px; color: #6b7280; text-align: left; margin: 10px 0; line-height: 1.7; }
    .result-info p { margin-bottom: 6px; }
    .result-info strong { color: #374151; }
    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 20px 0; }
    .step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .step-num { background: #dbeafe; color: #1e40af; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .step-text { font-size: 13px; color: #374151; line-height: 1.5; }
    .copy-btn { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #374151; margin-left: 8px; }
    .copy-btn:hover { background: #e5e7eb; }
    .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #6b7280; text-decoration: none; }
    .back-link:hover { color: #1e40af; }
    .loading { display: none; align-items: center; gap: 8px; font-size: 14px; color: #6b7280; justify-content: center; margin-top: 8px; }
    .spinner { width: 16px; height: 16px; border: 2px solid #d1d5db; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card" id="formCard">
  <div class="logo">
    <div class="logo-icon">🏫</div>
    <div class="logo-text">代课调课系统</div>
    <div class="logo-sub">学校激活向导</div>
  </div>

  <h1>激活学校账号</h1>
  <p class="subtitle">请填写以下信息激活您的学校账号。<br>如有授权码请直接填写；如需授权码请联系管理员：<strong style="color:#1e40af">Kai-2011YM</strong>（微信）</p>

  <div class="alert error" id="errMsg"></div>

  <form id="activateForm" onsubmit="doSubmit(event)">
    <div class="form-group">
      <label>授权码 *</label>
      <input type="text" id="code" placeholder="请输入授权码（如 AB12CD34）" maxlength="20" required>
    </div>
    <div class="form-group">
      <label>学校名称 *</label>
      <input type="text" id="schoolName" placeholder="如：XX市第一小学" maxlength="40" required>
    </div>
    <div class="form-group">
      <label>管理员姓名 *</label>
      <input type="text" id="adminName" placeholder="请输入管理员姓名" maxlength="20" required>
    </div>
    <div class="form-group">
      <label>手机号码 *</label>
      <input type="tel" id="phone" placeholder="请输入手机号（登录账号）" maxlength="11" required>
      <div class="hint">手机号将作为登录账号使用</div>
    </div>
    <div class="form-group">
      <label>登录密码 *</label>
      <input type="password" id="password" placeholder="请设置登录密码（至少6位）" minlength="6" required>
    </div>
    <div class="form-group">
      <label>确认密码 *</label>
      <input type="password" id="password2" placeholder="请再次输入密码" minlength="6" required>
    </div>

    <button type="submit" class="btn" id="submitBtn">立即激活</button>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span id="loadingText">正在创建学校，请稍候……</span>
    </div>
  </form>
</div>

<!-- 成功结果 -->
<div class="card result" id="resultCard">
  <div class="result-icon">🎉</div>
  <h2>学校创建成功！</h2>
  <p class="subtitle" style="margin-bottom:0">您的学校已开通，请复制下方链接访问管理后台</p>

  <div class="result-url">
    <a href="#" id="schoolUrl" target="_blank"></a>
    <button class="copy-btn" onclick="copyUrl()">复制链接</button>
  </div>

  <div class="result-info">
    <p>📌 <strong>访问说明</strong></p>
    <div class="step"><div class="step-num">1</div><div class="step-text">点击上方链接或复制到浏览器打开学校管理后台</div></div>
    <div class="step"><div class="step-num">2</div><div class="step-text">使用手机号和刚才设置的密码登录</div></div>
    <div class="step"><div class="step-num">3</div><div class="step-text">首次使用需导入课表数据（管理员 → 导入课表）</div></div>
    <div class="step"><div class="step-num">4</div><div class="step-text">部署需要约 30 秒，如遇空白页请稍后刷新</div></div>
    <hr class="divider">
    <p>📅 <strong>试用期限</strong>：<span id="expiresAt"></span>（90天试用）</p>
    <p>🔑 <strong>管理员账号</strong>：<span id="resultPhone"></span></p>
  </div>

  <button class="btn" onclick="goSchool()">前往学校管理后台 →</button>
  <a href="activate.html" class="back-link" onclick="resetForm()">← 激活另一所学校</a>
</div>

<script>
const BASE = location.origin;

function $(id) { return document.getElementById(id); }

function showErr(msg) {
  const el = $('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideErr() { $('errMsg').style.display = 'none'; }

async function doSubmit(e) {
  e.preventDefault();
  hideErr();

  const code = $('code').value.trim();
  const schoolName = $('schoolName').value.trim();
  const adminName = $('adminName').value.trim();
  const phone = $('phone').value.trim();
  const password = $('password').value;
  const password2 = $('password2').value;

  if (!code) return showErr('请输入授权码');
  if (!schoolName) return showErr('请输入学校名称');
  if (!adminName) return showErr('请输入管理员姓名');
  if (!/^1\d{10}$/.test(phone)) return showErr('手机号格式不正确（需11位以1开头的数字）');
  if (password.length < 6) return showErr('密码至少6位');
  if (password !== password2) return showErr('两次密码输入不一致');

  $('submitBtn').disabled = true;
  $('loading').style.display = 'flex';
  $('loadingText').textContent = '正在创建学校资源，约需10-20秒…';

  try {
    const resp = await fetch(BASE + '/api/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, schoolName, adminName, phone, password }),
    });
    const data = await resp.json();

    if (!resp.ok || !data.success) {
      showErr(data.message || '激活失败，请检查授权码是否正确');
      $('submitBtn').disabled = false;
      $('loading').style.display = 'none';
      return;
    }

    // 成功：显示结果
    $('formCard').style.display = 'none';
    $('resultCard').style.display = 'block';

    const url = data.url;
    $('schoolUrl').href = url;
    $('schoolUrl').textContent = url;
    $('expiresAt').textContent = data.expiresAt;
    $('resultPhone').textContent = phone;

  } catch (err) {
    showErr('网络错误，请检查网络连接后重试');
    $('submitBtn').disabled = false;
    $('loading').style.display = 'none';
  }
}

function copyUrl() {
  const url = $('schoolUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '已复制!';
    setTimeout(() => btn.textContent = '复制链接', 2000);
  }).catch(() => {
    prompt('复制失败，请手动复制：', url);
  });
}

function goSchool() {
  const url = $('schoolUrl').href;
  window.open(url, '_blank');
}

function resetForm() {
  $('formCard').style.display = 'block';
  $('resultCard').style.display = 'none';
  $('activateForm').reset();
  $('submitBtn').disabled = false;
  $('loading').style.display = 'none';
  hideErr();
}
</script>
</body>
</html>
